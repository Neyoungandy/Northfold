<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Northfold</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header>
    <a class="brand" href="index.html">Northfold</a>
    <nav aria-label="Main">
      <ul>
        <li><a href="#product">Shop</a></li>
        <li><a href="#contact">Contact</a></li>
        <li>
          <button type="button" id="open-cart" aria-controls="drawer">
            Cart
            <span id="cart-count">0</span>
          </button>
        </li>
      </ul>
    </nav>
  </header>

  <main>
    <p id="status" class="status" role="status">Loading product…</p>

    <article id="product" class="product" hidden>
      <div class="gallery">
        <div class="stage">
          <img id="main-image" alt="">
        </div>
        <div id="thumbs" class="thumbs"></div>
      </div>

      <div class="buy">
        <p class="kicker">From the catalogue</p>
        <h1 id="title"></h1>
        <p id="price" class="price"></p>
        <p id="description" class="lede"></p>

        <form id="buy-form">
          <div class="field">
            <label for="variant">Variant</label>
            <select id="variant" name="variant"></select>
          </div>

          <div class="qty-row">
            <label for="qty">Quantity</label>
            <input id="qty" name="qty" type="number" min="1" max="12" value="1">
          </div>

          <button type="submit">Add to cart</button>
        </form>
      </div>
    </article>
  </main>

  <div id="overlay" class="overlay" hidden></div>
  <aside id="drawer" class="drawer" hidden>
    <div class="drawer-head">
      <h2>Cart</h2>
      <button type="button" id="close-cart">Close</button>
    </div>
    <ul id="cart-lines"></ul>
    <p id="cart-empty" class="muted">Your cart is empty.</p>
    <p id="cart-subtotal" class="subtotal"></p>
  </aside>

  <footer id="contact">
    <p>Northfold · small homeware · catalogue via mock.shop while the store is built</p>
    <p>Questions: <a href="mailto:hello@northfold.example">hello@northfold.example</a></p>
    <p>&copy; 2026 Northfold</p>
  </footer>
  <script type="module" src="script.js"></script>
</body>
</html>
